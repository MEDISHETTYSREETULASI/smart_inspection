<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Inspection – Field Monitoring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b1730" />
    <script>
      // apply the saved theme before first paint (no flash of the wrong theme)
      try {
        var t = localStorage.getItem('sih_theme');
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (localStorage.getItem('sih_sidebar') === 'collapsed') document.documentElement.setAttribute('data-sidebar', 'collapsed');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
